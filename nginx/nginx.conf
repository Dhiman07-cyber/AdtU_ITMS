events {
  worker_connections  4096;
  multi_accept        on;
  use                 epoll;
}

http {
  # ── Security: hide server version ────────────────────────────────────────
  server_tokens off;

  # ── SSL / TLS ─────────────────────────────────────────────────────────────
  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers off;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;
  ssl_stapling              on;
  ssl_stapling_verify       on;

  # ── Security headers applied to all responses ────────────────────────────
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options    "nosniff"                                      always;
  add_header X-Frame-Options           "DENY"                                         always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
  add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;

  # ── Upstream: WebSocket servers (sticky session via ip_hash) ─────────────
  upstream ws_backend {
    ip_hash;
    server ws1:3001;
    server ws2:3001;
    keepalive 256;
  }

  # ── Upstream: Next.js app ─────────────────────────────────────────────────
  upstream nextjs_backend {
    server nextjs:3000;
    keepalive 64;
  }

  # ── Upstream: Health / Metrics (internal only) ───────────────────────────
  upstream health_backend {
    server ws1:9090;
    server ws2:9090;
    keepalive 16;
  }

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
  server {
    listen      80;
    server_name itms.example.com;
    location /   { return 301 https://$host$request_uri; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
  }

  # ── HTTPS server ──────────────────────────────────────────────────────────
  server {
    listen      443 ssl http2;
    server_name itms.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ── WebSocket upgrade ──────────────────────────────────────────────────
    location /ws {
      proxy_pass            http://ws_backend;
      proxy_http_version    1.1;
      proxy_set_header      Upgrade     $http_upgrade;
      proxy_set_header      Connection  "upgrade";
      proxy_set_header      Host        $host;
      proxy_set_header      X-Real-IP   $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_read_timeout    86400s;
      proxy_send_timeout    86400s;
      proxy_buffering       off;
      proxy_cache           off;
    }

    # ── Health endpoints (restrict to trusted IPs in production) ──────────
    location /health {
      # Uncomment in production to restrict health endpoint access:
      # allow 10.0.0.0/8;
      # deny all;
      proxy_pass         http://health_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # ── Prometheus metrics (restrict to monitoring system in production) ───
    location /metrics {
      # Uncomment in production to restrict metrics endpoint access:
      # allow 10.0.0.0/8;
      # deny all;
      proxy_pass         http://health_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # ── Next.js app ────────────────────────────────────────────────────────
    location / {
      proxy_pass            http://nextjs_backend;
      proxy_http_version    1.1;
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_read_timeout    30s;
      proxy_connect_timeout 10s;
    }
  }
}
