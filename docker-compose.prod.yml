version: '3.8'

services:
  redis:
    container_name: itms-redis
    image: redis:7.2-alpine
    # SECURITY: require password auth in production (set REDIS_PASSWORD in .env)
    command: >-
      redis-server
      --save 60 1
      --loglevel notice
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - itms

  ws1:
    container_name: itms-ws1
    image: ${ECR_WS_IMAGE_URL:-itms-ws:latest}
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - WS_PORT=3001
      - HEALTH_PORT=9090
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - itms

  ws2:
    container_name: itms-ws2
    image: ${ECR_WS_IMAGE_URL:-itms-ws:latest}
    ports:
      - "127.0.0.1:3003:3001"
    environment:
      - NODE_ENV=production
      - WS_PORT=3001
      - HEALTH_PORT=9090
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - itms

  nextjs:
    container_name: itms-nextjs
    image: ${ECR_APP_IMAGE_URL:-itms-app:latest}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health?liveness=1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - itms

  nginx:
    container_name: itms-nginx
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      ws1:
        condition: service_healthy
      ws2:
        condition: service_healthy
      nextjs:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - itms

  prometheus:
    container_name: itms-prometheus
    image: prom/prometheus:v2.54.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - itms

  alertmanager:
    container_name: itms-alertmanager
    image: prom/alertmanager:v0.27.0
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    networks:
      - itms

  grafana:
    container_name: itms-grafana
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      # SECURITY: GF_ADMIN_PASSWORD must be explicitly set in .env.
      # No default is provided here — Grafana will refuse to start if the var is empty,
      # preventing accidental deployment with the well-known 'admin' default credential.
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-itms_admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - alertmanager
    restart: unless-stopped
    networks:
      - itms

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  itms:
    driver: bridge
