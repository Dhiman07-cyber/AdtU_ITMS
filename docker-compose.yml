services:
  ws1:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001"
    environment:
      - NODE_ENV=production
      - WS_PORT=3001
      - HEALTH_PORT=9090
      - LOG_LEVEL=info
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - itms

  ws2:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001"
    environment:
      - NODE_ENV=production
      - WS_PORT=3001
      - HEALTH_PORT=9090
      - LOG_LEVEL=info
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - itms

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/nginx/certs:ro
    depends_on:
      - ws1
      - ws2
    restart: unless-stopped
    networks:
      - itms

networks:
  itms:
    driver: bridge
