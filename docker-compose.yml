services:
  redis:
    container_name: itms-redis
    image: redis:7.2-alpine
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - itms

  ws1:
    container_name: itms-ws1
    image: itms-ws:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - WS_PORT=3001
      - HEALTH_PORT=9090
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - itms

  ws2:
    container_name: itms-ws2
    image: itms-ws:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:3003:3001"
    environment:
      - NODE_ENV=production
      - WS_PORT=3001
      - HEALTH_PORT=9090
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - itms

  nextjs:
    container_name: itms-nextjs
    image: itms-nextjs:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-ci-placeholder}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-ci.firebaseapp.com}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-ci}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-ci.appspot.com}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-000000000000}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-1:000000000000:web:ci}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://ci.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-ci}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-ci}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET}
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_ASSET_FOLDER: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_ASSET_FOLDER}
        NEXT_PUBLIC_E2E_STAGING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - REDIS_URL=redis://redis:6379
      # The WebSocket transport (emitEvent -> WebSocketTransport) runs inside the
      # Next.js container and must reach the WS server. Use the Docker service name
      # (ws1), not 127.0.0.1, since the container's loopback does not expose the
      # WS port. The WS_PORT is 3001 inside the container (same as the ws1 service).
      - WS_HOST=ws1
      - WS_PORT=3001
      # Staging load-test harness (scripts/staging/master-simulation.ts):
      # STAGING_MODE + LOAD_TEST_SECRET enable the proxy-level IP rate-limit
      # bypass (x-load-test-bypass header) so high-volume simulated users are
      # NOT throttled by the global per-IP DDoS guard. The per-user route-level
      # rate limits (api-security.ts) remain ACTIVE — the harness never bypasses
      # per-user auth/RBAC/business rules.
      - STAGING_MODE=true
      - LOAD_TEST_SECRET=${LOAD_TEST_SECRET:-itms-staging-sim-secret}
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health?liveness=1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - itms

  nginx:
    container_name: itms-nginx
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      ws1:
        condition: service_healthy
      ws2:
        condition: service_healthy
      nextjs:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - itms

  prometheus:
    container_name: itms-prometheus
    image: prom/prometheus:v2.54.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
    restart: unless-stopped
    networks:
      - itms

  alertmanager:
    container_name: itms-alertmanager
    image: prom/alertmanager:v0.27.0
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    networks:
      - itms

  grafana:
    container_name: itms-grafana
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - alertmanager
    restart: unless-stopped
    networks:
      - itms

volumes:
  redis-data:

networks:
  itms:
    driver: bridge
