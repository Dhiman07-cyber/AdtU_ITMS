name: Continuous Integration (CI)

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.render/**'
      - 'Demo_Commit_message.txt'
      - 'alertmanager/**'
      - 'grafana/**'
      - 'prometheus/**'
      - 'nginx/**'
      - 'terraform/**'
      - 'LICENSE'
      - '.dockerignore'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.render/**'
      - 'Demo_Commit_message.txt'
      - 'alertmanager/**'
      - 'grafana/**'
      - 'prometheus/**'
      - 'nginx/**'
      - 'terraform/**'
      - 'LICENSE'
      - '.dockerignore'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 1. Code Quality & Type Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: TypeScript Check (App & Server)
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --project server/tsconfig.json
      - name: Code Style & ESLint Check
        run: npm run lint

  unit-tests:
    name: 2. Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Run Vitest Suite
        run: npm run test:run
