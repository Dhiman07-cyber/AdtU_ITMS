name: Render Telemetry & WebSocket Service (Render CI)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'render.yaml'
      - 'src/domains/realtime/**'
      - 'src/domains/gps/**'
      - '.github/workflows/render.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'render.yaml'
      - 'src/domains/realtime/**'
      - 'src/domains/gps/**'
      - '.github/workflows/render.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: 1. Validate & Build WebSocket Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Server TypeScript Verification
        run: npx tsc --noEmit --project server/tsconfig.json

      - name: Realtime & Telemetry Unit Tests
        run: npx vitest run server/websocket-server.test.ts src/domains/realtime src/domains/gps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify & Compile Render Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
