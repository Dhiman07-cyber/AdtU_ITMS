global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: 'itms-production-cluster'

rule_files:
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'itms-nextjs-cluster'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['nextjs:3000']
        labels:
          node: 'app-node-01'
          tier: 'frontend-api'
      - targets: ['host.docker.internal:3000']
        labels:
          node: 'app-host-fallback'
          tier: 'frontend-api'

  - job_name: 'itms-websocket-cluster'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ws1:9090']
        labels:
          node: 'ws-node-01'
          instance: 'ws1'
          tier: 'realtime-transport'
      - targets: ['ws2:9090']
        labels:
          node: 'ws-node-02'
          instance: 'ws2'
          tier: 'realtime-transport'
