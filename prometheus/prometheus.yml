global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'itms-nextjs'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: 'itms-websocket-ws1'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ws1:9090']

  - job_name: 'itms-websocket-ws2'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ws2:9090']
